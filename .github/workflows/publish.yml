name: Publish to npm

# Triggered by a version tag pushed via ./release.sh (e.g. v0.1.0).
# Builds every package (deps first, via turbo) and publishes all non-private
# workspace packages to npm. pnpm rewrites `workspace:*` cross-deps to the
# concrete version at pack time, so lockstep versioning keeps them resolvable.
#
# Third-party actions are pinned to a full commit SHA (not a mutable tag) so a
# retargeted tag can't inject code into the job that holds NPM_TOKEN.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # full history + tags so git-cliff can build the notes

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=!@canvas/storybook --filter=!@canvas/docs

      # Publish only for an actual version tag. A workflow_dispatch run on a
      # branch can build (a useful dry run) but must never push unreviewed branch
      # code to npm.
      #
      # TODO(security S2): migrate to npm Trusted Publishing (OIDC). id-token +
      # --provenance are already wired; once the trusted publisher is configured
      # on npmjs.com for this repo/workflow, drop NODE_AUTH_TOKEN / NPM_TOKEN —
      # the run then mints a short-lived per-run credential instead of using a
      # standing token.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes for the just-pushed tag. --latest = the most recent tag's section
      # (the version being released); --strip all drops the file header so the
      # release body is just this version's changes. Config: cliff.toml.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm exec git-cliff --latest --strip all -o RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
