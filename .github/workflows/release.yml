name: Release

# One workflow, one run per release. Cut a release locally with
#
#   ./release.sh <version> && git push origin main --follow-tags
#
# and the tag push drives every stage below:
#
#   resolve ─┬─ publish ── npm
#            ├─ notes ──── the GitHub Release
#            └─ storybook ─ GitHub Pages
#
# Everything is gated on the tag, so a plain commit to main deploys nothing.
# To redeploy the docs site between releases, run this workflow manually with
# an empty `tag` input — only the Storybook stage runs.
#
# NOTE: deploying Pages from a tag requires the `github-pages` environment to
# allow it. GitHub creates that environment restricted to the default branch,
# so add a tag rule `v*` under Settings → Environments → github-pages →
# "Deployment branches and tags", or the storybook job fails the protection
# check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)run the full release for, e.g. v0.0.14. Leave blank to redeploy Storybook only."
        required: false
        default: ""

# Releases must never be cancelled mid-publish.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Stage 0 ─────────────────────────────────────────────────────────────
  # Work out what we are releasing, so every later job shares one answer
  # instead of re-deriving it from github.ref.
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
      release: ${{ steps.target.outputs.release }}
    steps:
      - id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            printf 'ref=%s\ntag=%s\nrelease=true\n' "$INPUT_TAG" "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf 'ref=%s\ntag=%s\nrelease=true\n' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=%s\ntag=\nrelease=false\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "Target ref: ${{ steps.target.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Full release: ${{ steps.target.outputs.release }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 1 ─────────────────────────────────────────────────────────────
  # Build and publish every non-private workspace package. `workspace:*`
  # cross-deps are rewritten to the concrete version at pack time, so lockstep
  # versioning keeps them resolvable.
  publish:
    name: Build & publish to npm
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=!@canvas/storybook --filter=!@canvas/docs

      # TODO(security S2): migrate to npm Trusted Publishing (OIDC). id-token +
      # --provenance are already wired; once the trusted publisher is configured
      # on npmjs.com for this repo/workflow, drop NODE_AUTH_TOKEN / NPM_TOKEN —
      # the run then mints a short-lived per-run credential instead of using a
      # standing token.
      - name: Publish to npm
        # --no-git-checks: the tag is checked out in detached HEAD, which pnpm
        # would otherwise reject. Already-published versions are skipped rather
        # than failing, so a re-run is safe.
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Stage 2 ─────────────────────────────────────────────────────────────
  # The GitHub Release, with notes generated from Conventional Commits by
  # git-cliff using cliff.toml — the same config release.sh uses for
  # CHANGELOG.md.
  notes:
    name: GitHub Release
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          # Full history + tags are required for git-cliff to diff releases.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --current: the section for the tag at the checked-out commit. `--latest`
      # would read the newest tag in the repo, which is the wrong answer when
      # this is a dispatch re-run of an older one. --strip all drops the file
      # header so the release body is just this version's changes.
      - name: Generate release notes
        run: pnpm exec git-cliff --current --strip all -o RELEASE_NOTES.md

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          body_path: RELEASE_NOTES.md

  # ── Stage 3 ─────────────────────────────────────────────────────────────
  # The Storybook site. Independent of the publish stage — it builds from
  # source, so it needs no artifact, and it runs on a blank-tag dispatch too.
  storybook:
    name: Deploy Storybook
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=!@canvas/storybook --filter=!@canvas/docs

      - name: Build Storybook
        run: pnpm --filter storybook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
