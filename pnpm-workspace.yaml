packages:
  - "apps/*"
  - "packages/*"

# Only these dependencies may run install/build lifecycle scripts (pnpm 10+
# blocks all others by default). esbuild's postinstall links its platform
# binary and is required; nothing else in the tree needs a build script.
# Security S3: shrinks the arbitrary-code-on-install surface, incl. in CI.
onlyBuiltDependencies:
  - esbuild

# Security remediation (2026-07-19): force patched versions of vulnerable
# transitive dev/build-tooling deps flagged by `pnpm audit`. All are
# non-shipped (build/lint/docs/test toolchain). See SECURITY-AUDIT-2026-07-19.md.
overrides:
  # TEMPORARY (rfc:feat-2026-10-04-canvas-ui-uses-the-kit-workbook D-1): the design-kit
  # 0.0.32 (`Workbook`, the control scale) is unpublished, so these point at tarballs
  # packed from a local design-kit checkout. Machine-local: CI cannot install this.
  # Delete these lines once @invana/*@0.0.32 is on npm.
  "@invana/ui": "file:../design-kit/.local-packs/invana-ui-0.0.31.tgz"
  "@invana/styling": "file:../design-kit/.local-packs/invana-styling-0.0.31.tgz"
  "@invana/themes": "file:../design-kit/.local-packs/invana-themes-0.0.31.tgz"
  "@invana/forms": "file:../design-kit/.local-packs/invana-forms-0.0.31.tgz"
  # Same, for rfc:feat-2026-10-05-a-board-cannot-hold-a-canvas: @invana/boards and the
  # blocks/charts it needs are not on npm at all; tables/editor are packed from the
  # same checkout so the whole kit is one build.
  "@invana/boards": "file:../design-kit/.local-packs/invana-boards-0.0.31.tgz"
  "@invana/blocks": "file:../design-kit/.local-packs/invana-blocks-0.0.31.tgz"
  "@invana/charts": "file:../design-kit/.local-packs/invana-charts-0.0.31.tgz"
  "@invana/tables": "file:../design-kit/.local-packs/invana-tables-0.0.31.tgz"
  "@invana/editor": "file:../design-kit/.local-packs/invana-editor-0.0.31.tgz"
  # React types: the design-kit packages don't peer on @types/react, so their .d.ts resolve
  # `react` through pnpm's hidden hoist. VitePress's @docsearch/react (docs app only) was the
  # one consumer pulling @types/react@18, which made the kit's types resolve against 18 while
  # canvas compiles against 19. Keep a single @types/react major in the tree.
  "@docsearch/react>@types/react": "^19.2.17"
  # Single-major in the tree — plain range, no consumer crosses a major.
  ws: ">=8.21.1"
  "@xmldom/xmldom": ">=0.8.15 <0.9.0"
  flatted: ">=3.4.2"
  linkify-it: ">=5.0.1 <6"
  markdown-it: ">=14.2.0"
  rollup: ">=4.59.0"
  js-yaml: ">=4.2.0 <5"
  # Multiple majors coexist (ESLint + build tooling); scope each to its major
  # so the fix is a backward-compatible patch bump, never a breaking major.
  # (Requires pnpm 10's version-scoped override keys — hence the pnpm bump.)
  "minimatch@3": ">=3.1.4 <4"
  "minimatch@9": ">=9.0.7 <10"
  "picomatch@2": ">=2.3.2 <3"
  "picomatch@4": ">=4.0.4 <5"
  "brace-expansion@1": ">=1.1.13 <2"
  "brace-expansion@2": ">=2.0.3 <3"
  "brace-expansion@5": ">=5.0.6 <6"
