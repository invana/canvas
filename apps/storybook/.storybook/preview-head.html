<!-- Icon-font stylesheets used by storybook icon stories.
     PixiJS rasterises Text glyphs at creation time, so the font must be
     loaded into the document before the story `play` runs. `display=block`
     blocks rendering until the font is ready (3s timeout fallback). -->

<!-- Material Symbols Outlined -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">

<!-- FontAwesome 6 Free (Solid + Brands). Self-contained kit-less CDN. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
